<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>AVP Live</title>
<style>
:root {
  --bg: #000; --card: #0c0c0c; --raise: #131313; --line: #232323; --line2: #303030;
  --fg: #ececec; --act: #fff; --mut: #8d8d8d; --dim: #525252;
  --green: #3ccf74; --red: #ff5a52; --amber: #f2b33d;
  /* Agents in charts, in this order (validated against the card for colour blindness); then Other. */
  --s1: #3987e5; --s2: #d55181; --s3: #9085e9; --s4: #2fa6b8; --s0: #5a5a5a;
  --ease: cubic-bezier(.2, .8, .2, 1);
  --rail: 232px;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button, input { font: inherit; color: inherit; }
code, pre { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
.num { font-variant-numeric: tabular-nums; }
.mut { color: var(--mut); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; }
.empty { color: var(--dim); padding: 22px 18px; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes grow { from { transform: scaleX(0); } }
@keyframes col { from { transform: scaleY(0); } }
@keyframes draw { to { stroke-dashoffset: 0; } }
@keyframes breathe { 50% { opacity: .5; } }
@keyframes spin { to { transform: rotate(360deg); } }

/* The rail: one view per hash */
#rail { position: fixed; inset: 0 auto 0 0; width: var(--rail); padding: 22px 14px 18px; border-right: 1px solid var(--line); display: flex; flex-direction: column; gap: 2px; background: var(--bg); z-index: 5; }
.brand { display: flex; align-items: center; gap: 10px; padding: 4px 10px 26px; min-width: 0; }
.brand b { font-size: 17px; font-weight: 650; letter-spacing: -.01em; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.brand small { margin-left: auto; color: var(--dim); font-size: 12px; }
.pulse { flex: none; width: 8px; height: 8px; border-radius: 50%; background: var(--green); box-shadow: 0 0 0 0 rgba(60, 207, 116, .5); animation: pulse 2.4s infinite; }
.pulse.off { background: var(--red); animation: none; }
@keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(60, 207, 116, .45); } 70% { box-shadow: 0 0 0 9px rgba(60, 207, 116, 0); } 100% { box-shadow: 0 0 0 0 rgba(60, 207, 116, 0); } }
#rail nav { display: grid; gap: 2px; }
#rail nav a { position: relative; display: flex; align-items: center; gap: 12px; height: 38px; padding: 0 10px; border-radius: 10px; color: var(--mut); font-weight: 520; transition: color .2s, background .2s; }
#rail nav a:hover { color: var(--fg); background: #0e0e0e; }
#rail nav a[aria-current="page"] { color: var(--act); background: #161616; }
#rail nav a:focus-visible { outline: 1.5px solid var(--act); outline-offset: -1px; }
#rail svg { width: 18px; height: 18px; flex: none; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.badge { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 999px; background: var(--act); color: #000; font-size: 11.5px; font-weight: 650; line-height: 20px; text-align: center; font-style: normal; }
.badge:empty { display: none; }
.flag { margin-left: auto; width: 7px; height: 7px; border-radius: 50%; background: var(--c); box-shadow: 0 0 10px var(--c); }
.flag:not([style]) { display: none; }
.foot { margin-top: auto; padding: 0 10px; color: var(--dim); font-size: 12px; display: grid; gap: 2px; }

main { margin-left: var(--rail); padding: 40px 48px 96px; max-width: calc(var(--rail) + 1240px); }
.top { display: none; }
.view { display: none; }
.view.on { display: block; animation: rise .35s var(--ease); }
h1 { font-size: 36px; line-height: 1.1; font-weight: 680; letter-spacing: -.03em; margin: 0 0 28px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
h2 { font-size: 22px; font-weight: 640; letter-spacing: -.02em; margin: 44px 0 14px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
h1 small, h2 small { color: var(--mut); font-weight: 450; font-size: 14px; letter-spacing: 0; }
.right { margin-left: auto; }

/* What needs a person */
#attention { display: grid; gap: 8px; margin-bottom: 40px; }
#attention:empty { display: none; }
.att { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 14px 16px; border-radius: 14px; background: var(--card); border: 1px solid var(--line); animation: rise .5s var(--ease) both; }
.att > i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 12px var(--c); }
.att.red { border-color: rgba(255, 90, 82, .4); }
.att .w { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.att .w b { font-weight: 580; }
.att .w span { color: var(--mut); }
.att .a { color: var(--mut); font-size: 12.5px; white-space: nowrap; }
a.att .a { color: var(--act); font-weight: 560; }
a.att:hover { border-color: var(--line2); background: #0f0f0f; }

/* Figures: the last 48 hours against the before */
/* As many columns as figures that say something (--n): the row closes up. */
.tiles { display: grid; grid-template-columns: repeat(var(--n, 4), minmax(0, 1fr)); gap: 12px; }
.tile { padding: 18px 18px 14px; min-width: 0; display: flex; flex-direction: column; }
.tile > span { color: var(--mut); font-size: 12.5px; }
.tile b { display: block; margin: 10px 0 8px; font-size: 34px; font-weight: 660; letter-spacing: -.03em; line-height: 1; white-space: nowrap; }
.tile b small { font-size: 14px; color: var(--mut); font-weight: 500; margin-left: 5px; letter-spacing: 0; }
/* The before and its change, two pieces that wrap: a narrow card puts the change under, never cuts
   it. The card's sparkline stays at its foot whatever the lines above. */
.tile .was { flex: 1 0 auto; display: flex; flex-wrap: wrap; align-content: flex-start; column-gap: 6px; color: var(--dim); font-size: 12.5px; min-height: 18px; }
.tile .was span { min-width: 0; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile .was em { font-style: normal; white-space: nowrap; }
.tile .was em.up { color: var(--green); }
.tile .was em.down { color: var(--red); }
.tile svg { display: block; width: 100%; height: 30px; margin-top: 10px; overflow: visible; }
.tile svg:empty { display: none; }

/* The line, live */
#line { position: relative; padding: 70px 26px 26px; overflow: hidden; }
#track { position: relative; height: 22px; }
#track::before { content: ""; position: absolute; left: 0; right: 0; top: 10px; height: 1px; background: linear-gradient(90deg, transparent, var(--line2) 6%, var(--line2) 100%); }
.node { position: absolute; top: 4px; width: 14px; height: 14px; margin-left: -7px; border-radius: 50%; background: var(--bg); border: 1.5px solid var(--dim); transition: left .9s var(--ease), background .4s, border-color .4s, transform .2s var(--ease), box-shadow .3s; cursor: pointer; }
.node:hover, .node:focus-visible { transform: scale(1.3); }
.node:focus-visible { outline: 1.5px solid var(--act); outline-offset: 3px; }
.node.sel { box-shadow: 0 0 0 5px rgba(255, 255, 255, .18); }
.node.green { background: var(--green); border-color: var(--green); }
.node.red { background: var(--red); border-color: var(--red); }
.node.flaky { background: var(--amber); border-color: var(--amber); }
.node.pending { border-color: var(--fg); }
.node.pending::after { content: ""; position: absolute; inset: -5px; border-radius: 50%; border: 1px solid var(--fg); opacity: .5; animation: ring 1.8s infinite var(--ease); }
.node.fresh { animation: drop .8s var(--ease); }
@keyframes ring { from { transform: scale(.6); opacity: .7; } to { transform: scale(1.6); opacity: 0; } }
@keyframes drop { from { transform: translateY(-26px) scale(.2); opacity: 0; } to { transform: none; opacity: 1; } }
.pos { position: absolute; top: 28px; transform: translateX(-50%); color: var(--dim); font-size: 11px; transition: left .9s var(--ease); }
.env { position: absolute; top: -50px; transform: translateX(-50%); transition: left 1.4s var(--ease); display: flex; flex-direction: column; align-items: center; pointer-events: none; }
.env .tag { background: #181818; color: var(--fg); border: 1px solid var(--line2); font-weight: 620; font-size: 11px; letter-spacing: .02em; padding: 2px 9px; border-radius: 999px; white-space: nowrap; }
.env .stem { width: 1px; height: var(--stem, 22px); background: linear-gradient(var(--mut), transparent); }
.env.end { transform: translateX(calc(-100% + 8px)); align-items: flex-end; }
.env.end .stem { margin-right: 7.5px; }
.env.start { transform: translateX(-8px); align-items: flex-start; }
.env.start .stem { margin-left: 7.5px; }
.env.ghost .tag { background: transparent; color: var(--amber); border: 1px dashed var(--amber); }
.env.ghost .stem { background: linear-gradient(var(--amber), transparent); }
#arcs { position: absolute; left: 0; top: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
#arcs path { fill: none; stroke: var(--amber); stroke-width: 1.2; stroke-dasharray: 4 5; animation: flow 1s linear infinite; }
@keyframes flow { to { stroke-dashoffset: -9; } }
.under { display: none; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 30px; }
#line.busy .under { display: flex; }
.cells[hidden] { display: none; }
.step { display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px 6px 10px; color: var(--mut); font-size: 12.5px; }
.step b { color: var(--fg); font-weight: 560; }
.spin { width: 10px; height: 10px; border-radius: 50%; border: 1.5px solid var(--amber); border-right-color: transparent; animation: spin .9s linear infinite; }
.slots { margin-left: auto; display: flex; align-items: center; gap: 10px; color: var(--mut); font-size: 12.5px; }
.cells { display: grid; grid-template-columns: repeat(8, 9px); gap: 4px; }
.cells span { height: 9px; border-radius: 3px; background: #141414; border: 1px solid var(--line); transition: background .5s, border-color .5s; }
.cells span.run { background: var(--fg); border-color: var(--fg); animation: breathe 1.6s infinite; }
.cells span.wait { border-color: var(--amber); }

/* At work and the feed */
.cols { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); gap: 24px; align-items: start; }
#tasks { display: grid; gap: 10px; }
.task { padding: 16px 16px 14px; animation: rise .6s var(--ease); }
.task.hot { border-color: rgba(255, 90, 82, .45); }
.task.stale { opacity: .55; }
/* A stack reads bottom up: each task under the one it is stacked on, set in by its depth. */
.task.stacked { margin-left: calc(var(--depth) * 22px); border-left: 2px solid var(--s3); }
.who { display: flex; align-items: center; gap: 8px; color: var(--mut); font-size: 12.5px; min-width: 0; }
.who .agent { color: var(--fg); font-weight: 580; }
.goal { margin: 8px 0 12px; font-size: 14.5px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.meta { display: flex; gap: 14px; color: var(--mut); font-size: 12px; flex-wrap: wrap; }
.meta b { color: var(--fg); font-weight: 560; }
.meta code { font-size: 11.5px; color: var(--fg); }
.proofbar { display: flex; gap: 3px; margin-top: 12px; height: 6px; }
.proofbar span { flex: var(--w) 1 0; border-radius: 3px; background: var(--line2); transform-origin: left; animation: grow .7s var(--ease) both; }
.proofbar span.ok { background: var(--green); }
.proofbar span.ko { background: var(--red); }
.files { margin-top: 10px; display: flex; gap: 6px; flex-wrap: wrap; }
.files code { font-size: 11.5px; color: var(--mut); background: #121212; border: 1px solid var(--line); border-radius: 6px; padding: 2px 6px; }
#feed { padding: 4px 0; max-height: 640px; overflow: hidden; }
.ev { display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 10px; padding: 9px 16px; border-top: 1px solid var(--line); animation: rise .5s var(--ease); font-size: 13px; }
.ev:first-child { border-top: 0; }
.ev time { color: var(--dim); }
.ev q { quotes: "«\00a0" "\00a0»"; color: var(--fg); }
.ev .x { color: var(--mut); }
.ev .x b { color: var(--fg); font-weight: 560; }

/* Line: every position, page by page */
.find { display: flex; gap: 8px; margin-left: auto; align-self: center; }
.find input { width: 130px; background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 7px 10px; font-size: 13px; }
.find input:focus { outline: none; border-color: var(--mut); }
#positions { padding: 4px 0; }
.pr { display: grid; grid-template-columns: 58px 10px minmax(0, 1fr) 140px 64px 96px; align-items: center; gap: 16px; padding: 11px 18px; border-top: 1px solid var(--line); transition: background .15s; }
.pr:first-child { border-top: 0; }
.pr:hover { background: #101010; }
.pr.sel { background: #141414; box-shadow: inset 2px 0 0 var(--act); }
.pr.fresh { animation: rise .6s var(--ease); }
.pr .p { color: var(--mut); }
.pr.prhead { border: 0; padding-top: 0; padding-bottom: 8px; color: var(--dim); font-size: 12px; }
.pr.prhead:hover { background: none; }
.pr .pb .proofbar span.ok { background: rgba(60, 207, 116, .45); }
.pr .g { min-width: 0; }
.pr .g div, .pr .g small { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pr .g small { color: var(--mut); font-size: 12px; margin-top: 1px; }
.pr .g small b { color: var(--fg); font-weight: 540; }
.tg { display: inline-block; border: 1px solid var(--line2); border-radius: 999px; padding: 0 7px; margin-right: 6px; color: var(--fg); font-size: 11px; font-weight: 600; line-height: 17px; vertical-align: 1px; }
.pr .pb { display: flex; align-items: center; gap: 10px; }
.pr .pb .proofbar { flex: 1; margin: 0; height: 5px; }
.pr .pb span.num, .pr .tl, .pr .w { color: var(--mut); font-size: 12.5px; text-align: right; white-space: nowrap; }
.pr .pb span.num { width: 40px; }
.dot { width: 10px; height: 10px; border-radius: 50%; background: var(--dim); }
.dot.green { background: var(--green); }
.dot.red { background: var(--red); box-shadow: 0 0 10px rgba(255, 90, 82, .6); }
.dot.flaky { background: var(--amber); }
.dot.covered { background: transparent; border: 1.5px solid var(--green); }
.dot.pending { background: transparent; border: 1.5px solid var(--fg); animation: breathe 1.6s infinite; }
#more { display: flex; justify-content: center; padding: 18px; }
#more button, .btn { border: 1px solid var(--line2); background: #121212; color: var(--act); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
#more button:disabled { color: var(--dim); cursor: default; }
#flaky { padding: 4px 0; margin-bottom: 36px; }
.fl { display: grid; grid-template-columns: minmax(0, 1fr) auto auto 92px; align-items: center; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line); }
.fl:first-child { border-top: 0; }
.fl code { font-size: 12px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.fl code i { font-family: inherit; color: var(--mut); }
.fl .s { color: var(--mut); font-size: 12px; }
.fl .ps { display: flex; gap: 4px; }
.fl .ps a { border: 1px solid var(--line2); background: #121212; color: var(--act); border-radius: 999px; padding: 1px 8px; font-size: 11.5px; }
.fl .n { text-align: right; color: var(--mut); font-size: 12px; line-height: 1.3; }

/* Review: a task waiting for a person's word, its change and its proof */
#review .rv { padding: 18px; margin-bottom: 14px; animation: rise .6s var(--ease); border-color: rgba(242, 179, 61, .35); }
#review .rv .goal { -webkit-line-clamp: unset; font-size: 16px; }
.diff { margin: 12px 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.diff details + details { border-top: 1px solid var(--line); }
.diff summary { cursor: pointer; padding: 8px 12px; font: 12.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--fg); list-style: none; display: flex; gap: 10px; }
.diff summary::-webkit-details-marker { display: none; }
.diff summary i { font-style: normal; color: var(--mut); margin-left: auto; }
.diff pre { margin: 0; padding: 8px 0; max-height: 420px; overflow: auto; font-size: 12px; line-height: 1.55; background: #070707; }
.diff pre span { display: block; padding: 0 12px; white-space: pre; }
.diff pre .add { background: rgba(60, 207, 116, .1); color: #b9f0cd; }
.diff pre .del { background: rgba(255, 90, 82, .1); color: #ffc2bd; }
.diff pre .hunk { color: var(--mut); }
.act { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.act input { flex: 1; min-width: 160px; background: #0f0f0f; border: 1px solid var(--line2); border-radius: 10px; padding: 8px 10px; font-size: 13px; }
.act input:focus { outline: none; border-color: var(--mut); }
.act button { border: 1px solid var(--line2); background: #121212; color: var(--act); border-radius: 10px; padding: 8px 14px; font-size: 13px; cursor: pointer; }
.act button.ok { background: var(--act); color: #000; border-color: var(--act); font-weight: 600; }
.act button:disabled { opacity: .5; cursor: default; }
.act .said { color: var(--mut); font-size: 12.5px; }
.act .as { color: var(--mut); font-size: 13px; margin-right: auto; }
.act .as b { color: var(--fg); font-weight: 560; }

/* Sign-in: a server with accounts asks who is reading */
#signin { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: radial-gradient(900px 520px at 50% -8%, #0d1a12 0%, #000 62%); }
#signin[hidden] { display: none; }
#signin form { width: min(400px, 100%); display: grid; gap: 14px; padding: 30px 28px 24px; animation: rise .45s var(--ease); box-shadow: 0 40px 120px rgba(0, 0, 0, .7); }
#signin .brand { padding: 0 0 8px; }
#signin h1 { font-size: 26px; margin: 0; }
#signin p { margin: 0; color: var(--mut); }
#signin input { height: 44px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line2); background: #070707; font: 13px ui-monospace, "SF Mono", Menlo, monospace; outline: none; transition: border-color .2s; }
#signin input:focus { border-color: var(--act); }
#signin button, #signin a.gh { height: 44px; border-radius: 10px; border: 1px solid var(--line2); background: var(--raise); color: var(--act); cursor: pointer; font-weight: 600; display: flex; align-items: center; justify-content: center; gap: 10px; transition: background .2s, transform .1s; }
#signin button.go { background: var(--act); color: #000; border-color: var(--act); }
#signin a.gh:hover { background: #1a1a1a; }
#signin button:active, #signin a.gh:active { transform: scale(.985); }
#signin button:disabled { opacity: .5; cursor: default; }
#signin .or { display: flex; align-items: center; gap: 12px; color: var(--dim); font-size: 12px; }
#signin .or::before, #signin .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
#signin .bad { color: var(--red); font-size: 13px; }
#signin .bad:empty { display: none; }
#signin .hint { color: var(--dim); font-size: 12px; }
#signin .hint code { color: var(--mut); }
#signin svg { width: 18px; height: 18px; fill: currentColor; }
.me { display: flex; gap: 8px; align-items: baseline; min-width: 0; }
.me b { color: var(--mut); font-weight: 560; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.me button { margin-left: auto; padding: 0; border: 0; background: none; color: var(--dim); font-size: 12px; cursor: pointer; text-decoration: underline; text-underline-offset: 2px; }
.me button:hover { color: var(--fg); }

/* Charts: inline SVG, drawn at the width they get */
.seg { display: inline-flex; gap: 2px; padding: 3px; border: 1px solid var(--line); border-radius: 11px; align-self: center; }
.seg button { border: 0; background: none; color: var(--mut); border-radius: 8px; padding: 5px 11px; font-size: 13px; font-weight: 520; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--act); color: #000; }
.facts { display: grid; grid-template-columns: repeat(var(--n, 6), minmax(0, 1fr)); margin: 12px 0; }
.facts > div { padding: 14px 18px; border-left: 1px solid var(--line); min-width: 0; }
.facts > div:first-child { border-left: 0; }
.facts span { display: block; color: var(--mut); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.facts b { display: block; font-size: 20px; font-weight: 640; letter-spacing: -.02em; margin: 4px 0 2px; }
.facts small { color: var(--dim); font-size: 12px; white-space: nowrap; }
.charts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.chart { padding: 18px 18px 10px; min-width: 0; }
.chart.wide { grid-column: 1 / -1; }
.chart h3 { margin: 0; font-size: 15px; font-weight: 600; display: flex; gap: 14px; align-items: baseline; flex-wrap: wrap; }
.chart h3 small { color: var(--mut); font-weight: 450; font-size: 12.5px; }
.keys { display: flex; gap: 14px; flex-wrap: wrap; color: var(--mut); font-size: 12px; font-weight: 450; margin-left: auto; }
.keys i { display: inline-block; width: 10px; height: 3px; border-radius: 2px; margin-right: 6px; vertical-align: middle; background: var(--c); }
.chart svg { display: block; overflow: visible; margin-top: 12px; }
svg .gl { stroke: #1c1c1c; stroke-width: 1; }
svg .base { stroke: #333; stroke-width: 1; }
svg text { fill: var(--mut); font-size: 11px; font-variant-numeric: tabular-nums; }
svg text.v { fill: var(--fg); font-weight: 560; }
svg .colm { transform-box: fill-box; transform-origin: bottom; animation: col .8s var(--ease) both; }
svg .hbar { transform-box: fill-box; transform-origin: left; animation: grow .9s var(--ease) both; }
svg .ln { fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 1; stroke-dashoffset: 1; animation: draw 1.2s var(--ease) forwards; }
svg .ref { fill: none; stroke: var(--dim); stroke-width: 1; }
svg .wash { opacity: .1; }
svg .hit { fill: transparent; }
svg .cross { stroke: #3a3a3a; stroke-width: 1; opacity: 0; transition: opacity .12s; }
svg .band:hover .cross { opacity: 1; }
svg .band:hover ~ .x { opacity: 1; }
svg .end { stroke: var(--card); stroke-width: 2; }

/* Environments */
#envs { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
.envc { padding: 18px; animation: rise .5s var(--ease) both; }
.envc .n { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 620; }
.envc .n .spin { margin-left: auto; }
.envc .at { display: flex; align-items: baseline; gap: 10px; margin: 14px 0 6px; }
.envc .at b { font-size: 40px; font-weight: 670; letter-spacing: -.03em; line-height: 1; }
.envc .at span { color: var(--mut); font-size: 12.5px; }
.envc .goal { -webkit-line-clamp: 2; margin: 6px 0 10px; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
.chips span { border: 1px solid var(--line2); border-radius: 999px; padding: 2px 9px; color: var(--mut); font-size: 11.5px; }
.chips span b { color: var(--fg); font-weight: 520; }
.envc .cmd { display: block; margin-top: 10px; color: var(--mut); font-size: 11.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.envc .going { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 10px; color: var(--mut); font-size: 12.5px; }
.envc .going b { color: var(--fg); }
.envc .going.ko::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--red); box-shadow: 0 0 10px var(--red); flex: none; }
#paths { padding: 6px 0; }
.path { display: grid; grid-template-columns: 54px minmax(0, 1.2fr) minmax(0, 2fr) 74px; align-items: center; gap: 14px; padding: 12px 18px; border-top: 1px solid var(--line); }
.path:first-child { border-top: 0; }
.path .p { color: var(--mut); }
.path .t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.path .t small { display: block; color: var(--mut); font-size: 11.5px; }
.bar { position: relative; height: 8px; border-radius: 4px; background: #121212; overflow: hidden; display: flex; gap: 2px; }
.bar span { height: 100%; transform-origin: left; animation: grow .9s var(--ease) both; }
.bar .full { background: #8a8a8a; }
.bar .stg { background: var(--s1); }
.bar .prd { background: var(--s3); }
.bar .wait { background: repeating-linear-gradient(90deg, #262626 0 4px, transparent 4px 8px); }
.path .total { text-align: right; font-weight: 600; }
.legend { display: flex; gap: 16px; color: var(--mut); font-size: 12px; font-weight: 450; letter-spacing: 0; margin-left: auto; }
.legend i { display: inline-block; width: 10px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.rows { padding: 4px 0; }
.row { display: grid; grid-template-columns: 52px 8px 110px 58px minmax(0, 1fr) auto; align-items: center; gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line); font-size: 13px; }
.row:first-child { border-top: 0; }
.row time { color: var(--dim); }
.row > i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.row > i.ring { background: transparent; border: 1.5px solid var(--c); }
.row .x { color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row a.num { color: var(--act); }

/* Setup */
.grid2 { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 12px; align-items: start; }
.ag { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) 64px 54px 88px; align-items: center; gap: 14px; padding: 11px 18px; border-top: 1px solid var(--line); }
.ag:first-child { border-top: 0; }
.ag.head { color: var(--dim); font-size: 12px; padding-top: 12px; padding-bottom: 8px; }
.ag b { font-weight: 580; }
.ag b small { color: var(--dim); font-weight: 450; margin-left: 6px; font-size: 12px; }
.ag .ppl { color: var(--mut); font-size: 12.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ag .num { text-align: right; }
.ag .w { color: var(--mut); font-size: 12.5px; text-align: right; white-space: nowrap; }
.ag .share { grid-column: 1 / -1; height: 3px; margin-top: -4px; border-radius: 2px; background: #161616; overflow: hidden; }
.ag .share span { display: block; height: 100%; background: var(--c); transform-origin: left; animation: grow 1s var(--ease) both; }
.kv { padding: 6px 0; }
.kv > div { display: grid; grid-template-columns: 130px minmax(0, 1fr); gap: 14px; padding: 10px 18px; border-top: 1px solid var(--line); align-items: baseline; }
.kv > div:first-child { border-top: 0; }
.kv > div > span { color: var(--mut); font-size: 12.5px; }
.kv code { font-size: 12px; color: var(--fg); word-break: break-word; }
.kv .st { display: grid; gap: 6px; }
.kv .st div { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.kv .st b { font-weight: 580; }
.kv .st code { color: var(--mut); }
.kv .st em { font-style: normal; color: var(--dim); font-size: 12px; }
.paths code { display: inline-block; margin: 0 6px 4px 0; padding: 1px 7px; border: 1px solid var(--line2); border-radius: 6px; color: var(--fg); }
#workers { padding: 18px; }
#workers .big { font-size: 40px; font-weight: 670; letter-spacing: -.03em; line-height: 1; }
#workers .cells { grid-template-columns: repeat(16, minmax(0, 1fr)); gap: 6px; margin: 16px 0 12px; }
#workers .cells span { height: auto; aspect-ratio: 1; border-radius: 5px; }
.sub { color: var(--mut); font-size: 12.5px; }
.sub.amber { color: var(--amber); }

/* A position, read in place: what it changed, who landed it, its proof, its conversation */
#sheet { position: fixed; z-index: 20; top: 12px; right: 12px; bottom: 12px; width: min(700px, calc(100vw - 24px)); overflow: auto; overscroll-behavior: contain; padding: 18px 22px 26px; box-shadow: 0 30px 80px rgba(0, 0, 0, .75); animation: slide .45s var(--ease); outline: none; }
@keyframes slide { from { opacity: 0; transform: translateX(28px); } to { opacity: 1; transform: none; } }
#sheet .top2 { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
#sheet .top2 b { font-size: 32px; font-weight: 670; letter-spacing: -.03em; margin-right: 6px; }
#sheet .top2 button { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line2); background: #121212; color: var(--act); font-size: 15px; line-height: 1; cursor: pointer; }
#sheet .top2 button:hover:not(:disabled) { border-color: var(--mut); }
#sheet .top2 button:disabled { opacity: .3; cursor: default; }
#sheet .top2 .x { margin-left: auto; }
.pill { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line2); border-radius: 999px; padding: 3px 10px; color: var(--mut); font-size: 12px; white-space: nowrap; }
.pill::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c); }
.pill.bare { padding: 0; border: 0; }
.pill.bare::before { width: 10px; height: 10px; box-shadow: 0 0 10px var(--c); }
#sheet .goal { -webkit-line-clamp: unset; font-size: 16px; white-space: pre-wrap; }
#sheet h3 { display: flex; align-items: baseline; gap: 10px; margin: 26px 0 10px; font-size: 14px; font-weight: 620; }
#sheet h3 small { color: var(--mut); font-weight: 450; font-size: 12.5px; }
#sheet .back { margin: -4px 0 12px; font-size: 13px; }
#sheet .back a { color: var(--amber); }
#sheet .talk { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 12px; font-size: 13px; }
#sheet .talk a { color: var(--act); font-weight: 560; }
#sheet .talk code { color: var(--mut); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps { display: grid; margin-top: 8px; }
.steps > details { border-top: 1px solid var(--line); }
.steps > details:first-child { border-top: 0; }
.steps summary { display: grid; grid-template-columns: 8px auto minmax(0, 1fr) auto auto; align-items: center; gap: 10px; padding: 7px 0; font-size: 13px; cursor: pointer; list-style: none; }
.steps summary::-webkit-details-marker { display: none; }
.steps i { width: 8px; height: 8px; border-radius: 50%; background: var(--green); }
.steps i.ko { background: var(--red); }
.steps b { font-weight: 560; }
.steps code { font-size: 11.5px; color: var(--dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.steps summary > span { color: var(--mut); }
.steps summary a { color: var(--mut); font-size: 12px; text-decoration: none; border: 1px solid var(--line2); border-radius: 999px; padding: 1px 9px; }
.steps summary a:hover { color: var(--act); border-color: var(--mut); }
.steps pre { position: relative; margin: 0 0 8px; padding: 8px 0; max-height: 360px; overflow: auto; background: #070707; border: 1px solid var(--line); border-radius: 10px; font-size: 11.5px; line-height: 1.5; color: var(--fg); }
.steps pre > span { display: block; padding: 0 12px; white-space: pre-wrap; }
.steps pre em { display: inline-block; min-width: 52px; margin-right: 10px; color: var(--dim); font-style: normal; text-align: right; user-select: none; }
.steps pre .first { background: rgba(255, 90, 82, .12); color: #ffc2bd; }
.steps pre .cut, .steps .more { color: var(--mut); }
.steps .more { margin: -2px 0 10px; font-size: 12px; }
#tip { position: fixed; z-index: 30; max-width: 380px; background: #111; border: 1px solid var(--line2); border-radius: 12px; padding: 10px 12px; font-size: 12.5px; pointer-events: none; opacity: 0; transform: translateY(4px); transition: opacity .15s, transform .15s; box-shadow: 0 20px 50px rgba(0, 0, 0, .6); }
#tip.on { opacity: 1; transform: none; }
#tip .g { color: var(--fg); margin-bottom: 4px; }
#tip .m { color: var(--mut); }
#tip .k { display: grid; grid-template-columns: 10px minmax(0, 1fr) auto; gap: 8px; align-items: center; color: var(--mut); }
#tip .k i { width: 8px; height: 3px; border-radius: 2px; background: var(--c); }
#tip .k b { color: var(--fg); font-weight: 560; font-variant-numeric: tabular-nums; }

@media (max-width: 1100px) {
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles > .tile:last-child:nth-child(odd) { grid-column: 1 / -1; }
  .facts { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .facts > div:nth-child(4) { border-left: 0; }
  .facts > div:nth-child(n + 4) { border-top: 1px solid var(--line); }
  .cols, .grid2, .charts { grid-template-columns: minmax(0, 1fr); }
  .pr { grid-template-columns: 52px 10px minmax(0, 1fr) 120px 84px; }
  .pr .tl { display: none; }
}
/* Phone: the rail goes to the bottom, as a tab bar. */
@media (max-width: 760px) {
  #rail { inset: auto 0 0 0; width: auto; height: calc(62px + env(safe-area-inset-bottom)); padding: 6px 4px env(safe-area-inset-bottom); flex-direction: row; border-right: 0; border-top: 1px solid var(--line); background: rgba(0, 0, 0, .92); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
  #rail .brand, #rail .foot { display: none; }
  #rail nav { grid-auto-flow: column; grid-auto-columns: 1fr; width: 100%; }
  #rail nav a { flex-direction: column; justify-content: center; gap: 3px; height: 50px; padding: 0 2px; font-size: 10.5px; }
  #rail nav a[aria-current="page"] { background: transparent; }
  #rail nav a span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 100%; }
  .badge { position: absolute; top: 2px; left: calc(50% + 6px); min-width: 16px; height: 16px; line-height: 16px; font-size: 10px; padding: 0 4px; }
  .flag { position: absolute; top: 6px; left: calc(50% + 10px); }
  main { margin-left: 0; padding: 18px 16px calc(96px + env(safe-area-inset-bottom)); }
  .top { display: flex; align-items: center; gap: 10px; margin-bottom: 22px; }
  .top b { font-size: 16px; font-weight: 650; }
  h1 { font-size: 30px; margin-bottom: 20px; }
  h2 { font-size: 19px; margin-top: 34px; }
  .tile { padding: 14px; }
  .tile b { font-size: 27px; }
  #line { padding-left: 14px; padding-right: 14px; }
  .pr { grid-template-columns: 40px 10px minmax(0, 1fr) 54px; gap: 10px; padding: 11px 14px; }
  .pr .pb { display: none; }
  .pr .w { font-size: 11.5px; }
  .fl { grid-template-columns: minmax(0, 1fr) auto; }
  .fl .s, .fl .n { display: none; }
  .path { grid-template-columns: 44px minmax(0, 1fr) 60px; }
  .path .bar { grid-column: 1 / -1; }
  .path .total { grid-row: 1; grid-column: 3; }
  .row { grid-template-columns: 40px 8px minmax(0, 1fr) 40px auto; gap: 10px; padding: 10px 14px; }
  .row .x { display: none; }
  .ag { grid-template-columns: minmax(0, 1fr) 48px 70px; }
  .ag .ppl, .ag .o { display: none; }
  .kv > div { grid-template-columns: minmax(0, 1fr); gap: 4px; }
  .find input { width: 96px; }
  .prhead { display: none; }
  .facts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .facts > div:nth-child(odd) { border-left: 0; }
  .facts > div:nth-child(4) { border-left: 1px solid var(--line); }
  .facts > div:nth-child(n + 3) { border-top: 1px solid var(--line); }
  #sheet { top: 0; right: 0; bottom: 0; width: 100vw; border-radius: 0; padding: 14px 16px calc(24px + env(safe-area-inset-bottom)); }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } svg .ln { stroke-dashoffset: 0; } }
</style>
</head>

<script>
"use strict";
// AVP Live: the product's interface, read from the server's own API every few seconds. One view per
// hash (#overview, #line, #review, #stats, #envs, #setup); a position opens over any of them
// (#line/52). Read-only, except for a person's word on a task that waits for one (Review).
const FR = (navigator.language || "").toLowerCase().startsWith("fr");

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
// Every request says it comes from this page (x-avp-live): the session cookie is taken for a POST
// only then, which a form on another site cannot send. A 401 is a server with accounts: sign in.
const LIVE = { "x-avp-live": "1" };
const api = (p) => fetch(p, { cache: "no-store", headers: LIVE }).then((r) => {
  if (r.status === 401) signIn();
  return r.ok ? r.json() : Promise.reject(new Error(String(r.status)));
});
const mins = (ms) => Math.max(0, Math.round(ms / 60000));
const fmtInt = (n) => Math.round(n).toLocaleString(LOCALE);
const clock = (ms) => new Date(ms).toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit" });
function when(ms) {
  const d = new Date(ms);
  return d.toDateString() === new Date().toDateString() ? clock(ms) : d.toLocaleString(LOCALE, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
}
// A span as a person says it: seconds, minutes, hours, days.
function dur(ms) {
  if (ms == null || !isFinite(ms)) return "·";
  const s = Math.max(0, ms / 1000);
  return s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} min` : s < 172800 ? `${(s / 3600).toFixed(s < 36000 ? 1 : 0)} h` : `${Math.round(s / 86400)} d`;
}
// A goal's first sentence, cut at a word: a whole idea, never a bare prefix like "Trust".
const short = (g, n = 90) => { const s = String(g || "").split(/\.\s/)[0]; if (s.length <= n) return s; const c = s.slice(0, n - 1); return c.slice(0, Math.max(c.lastIndexOf(" "), n * .6)) + "…"; };
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;

// Every coding agent by the name a person knows it by, whatever it calls itself (AVP_AGENT, its MCP
// client's name): none is the default, an unknown one keeps its own name.
const AGENT_NAMES = [
  [/claude/, "Claude Code"], [/codex/, "Codex"], [/cursor/, "Cursor"], [/gemini/, "Gemini CLI"], [/copilot/, "GitHub Copilot"],
  [/opencode/, "OpenCode"], [/windsurf|codeium/, "Windsurf"], [/^amp\b|ampcode/, "Amp"], [/aider/, "Aider"], [/qwen/, "Qwen Code"],
  [/kiro/, "Kiro"], [/^zed/, "Zed"], [/cline/, "Cline"], [/^roo|roo-?code/, "Roo Code"], [/goose/, "Goose"], [/junie/, "Junie"], [/continue/, "Continue"],
];
function agentName(id) {
  const a = String(id || "human").toLowerCase();
  if (a === "human") return T.human;
  if (a === "full suite" || a === "avp") return "AVP";
  if (a.startsWith("pr-")) return "PR " + a.slice(3);
  return AGENT_NAMES.find(([re]) => re.test(a))?.[1] || String(id);
}
const who = (actor) => ({ name: agentName(actor?.agent), person: actor?.person || "" });
// A chart's colour follows the agent, never its rank in one chart: the first four agents of the
// line (most landed) keep theirs, the others are Other.
const SLOTS = ["var(--s1)", "var(--s2)", "var(--s3)", "var(--s4)"];
function agentColor(name) {
  const order = [...new Set((S.agents || []).map((a) => agentName(a.agent)))];
  const i = order.indexOf(name);
  return i >= 0 && i < SLOTS.length ? SLOTS[i] : "var(--s0)";
}

async function pickRepo() {
  const want = new URLSearchParams(location.search).get("repo");
  if (want) return want;
  const repos = await api("/repos");
  const named = repos.find((r) => r.name === "murmell");
  return (named || repos.sort((a, b) => b.created_at - a.created_at)[0])?.name;
}

// ---- Events ----
// The page opens on the newest events, and on the last ones of the kinds it keeps longer (flakes,
// deploys, the mirror, a person's word): a line of thousands of positions holds far more than it
// needs. Then each tick reads what came since.
const KEEP = 4000;
function absorb(evs) {
  const fresh = [...new Map(evs.filter((e) => !S.ids.has(e.id)).map((e) => [e.id, e])).values()].sort((a, b) => a.id - b.id);
  for (const e of fresh) {
    S.ids.add(e.id);
    if (e.task) S.dirty.add(e.task);
    if (e.kind === "task.opened" && e.task) { actorOf.set(e.task, e.data.actor); goalOf.set(e.task, e.data.goal); }
    if ((e.kind === "task.landed" || e.kind === "task.awaiting_approval" || e.kind === "task.goal") && e.task && e.data.goal) goalOf.set(e.task, e.data.goal);
    // Kept for a week whatever the events cut: a busy line writes more than 4000 of them a day.
    if (e.kind === "line.flaky") S.flaky.push(e);
    if (e.kind.startsWith("env.")) { S.envEvents.push(e); if (S.envEvents.length > 400) S.envEvents.shift(); }

// ---- Flaky tests ----
// What each shard that flaked in the last 7 days failed before its retry went green, one row per test

    for (const test of named.length ? named : [""]) {

    + `<span class="n">${esc(T.times(g.n))}<br>${esc(T.ago(mins(now - g.last)))}</span></div>`).join(""));

    if (got[0]?.position === pos) S.extra.set(pos, got[0]); else S.extra.set(pos, { missing: true, position: pos });

      ...[e.proof, fullProof].filter((p) => p && !S.proofs.has(p)).map((p) => api(`/repos/${repo}/proofs/${p}`).then((x) => S.proofs.set(p, x), () => {})),

// Lines per bucket, broken where a bucket has no value; the first one washed underneath. A value
// alone between two empty buckets (landings on the 26th and the 28th, none on the 27th) is a path
// that only moves, which SVG does not draw: it gets a dot of its own.
function lines(w, h, labels, series, fmt, title) {
  const l = 44, r = 8, t = 10, b = 24, iw = w - l - r, ih = h - t - b;
  const max = niceMax(Math.max(0, ...series.flatMap((S2) => S2.values.filter((v) => v != null))));
  const x = (i) => l + (labels.length < 2 ? iw / 2 : (i * iw) / (labels.length - 1));
  const y = (v) => t + ih - (v / max) * ih;
  let g = frame(w - r, h, max, fmt, l, t, ih);
  series.forEach((S2, k) => {
    const lastI = S2.values.map((v, i) => (v != null ? i : -1)).filter((i) => i >= 0).pop();
    let d = "", area = "", dots = "", run = [];
    const flush = () => {
      if (run.length > 1 && k === 0) area += `M${x(run[0])} ${t + ih}` + run.map((i) => `L${x(i)} ${y(S2.values[i])}`).join("") + `L${x(run[run.length - 1])} ${t + ih}Z`;
      if (run.length === 1 && run[0] !== lastI) dots += `<circle class="end" cx="${x(run[0])}" cy="${y(S2.values[run[0]])}" r="3" fill="${S2.color}"/>`;
      run = [];
    };
    S2.values.forEach((v, i) => { if (v == null) { flush(); return; } d += `${run.length ? "L" : "M"}${x(i)} ${y(v)}`; run.push(i); });
    flush();
    if (area) g += `<path class="wash" fill="${S2.color}" d="${area}"/>`;
    if (d) g += `<path class="ln" pathLength="1" stroke="${S2.color}" style="animation-delay:${k * 150}ms" d="${d}"/>`;
    g += dots;
    if (lastI != null) g += `<circle class="end" cx="${x(lastI)}" cy="${y(S2.values[lastI])}" r="4" fill="${S2.color}"/>`;
  });
  const band = labels.length < 2 ? iw : iw / (labels.length - 1);
  labels.forEach((_, i) => {
    const rows = series.filter((S2) => S2.values[i] != null).map((S2) => [S2.color, S2.name, fmt(S2.values[i])]);
    g += `<g class="band"><line class="cross" x1="${x(i)}" x2="${x(i)}" y1="${t}" y2="${t + ih}"/><rect class="hit" x="${x(i) - band / 2}" y="${t}" width="${band}" height="${ih}" data-tip="${esc(tipRows(title(i), rows))}"/></g>`;
  });
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}${xLabels(labels, x, h - 6)}</svg>`;
}
// One bar per row, its name on the left and its value at its end.
function bars(w, rows, fmt) {
  const lw = Math.min(150, w * .36), vw = 64, rh = 30, h = rows.length * rh, iw = w - lw - vw;
  const max = Math.max(1, ...rows.map((r) => r.value));
  const g = rows.map((r, i) => {
    const y = i * rh, bw = Math.max(2, (r.value / max) * iw);
    return `<g data-tip="${esc(tipRows(r.name, [[r.color, r.sub || "", fmt(r.value)]]))}"><rect class="hit" x="0" y="${y}" width="${w}" height="${rh}"/><text class="v" x="0" y="${y + 19}">${esc(r.name)}</text>`
      + `<path class="hbar" style="animation-delay:${i * 50}ms" fill="${r.color}" d="M${lw} ${y + 10}H${lw + bw - 4}Q${lw + bw} ${y + 10} ${lw + bw} ${y + 14}V${y + 16}Q${lw + bw} ${y + 20} ${lw + bw - 4} ${y + 20}H${lw}Z"/>`
      + `<text x="${lw + bw + 8}" y="${y + 19}">${esc(fmt(r.value))}</text></g>`;
  }).join("");
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${g}</svg>`;
}
const keys = (items) => `<span class="keys">${items.map(([c, n]) => `<span><i style="--c:${c}"></i>${esc(n)}</span>`).join("")}</span>`;
// The agents of a stats answer by the name people know them by (an agent's CLI and its MCP client
// are one), the most landed first.
function byAgent(st) {
  const m = new Map();
  for (const [id, n] of Object.entries(st?.by_agent || {})) { const name = agentName(id); m.set(name, (m.get(name) || 0) + n); }
  return [...m.entries()].sort((a, b) => b[1] - a[1]);
}
function renderStats() {
  const st = S.stats;
  document.querySelectorAll("#ranges button").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.r === range)));
  if (!st || st.range !== range) return;
  if (!st.whole) { put($("stats"), `<div class="card empty">${esc(T.noStats)}</div>`); $("stats").dataset.sig = ""; return; }
  const box = $("stats"), w0 = box.clientWidth || 900;
  const series = st.series.filter((d) => d.s);
  const half = innerWidth <= 1100 ? w0 - 38 : (w0 - 12) / 2 - 38, wide = w0 - 38;
  const labels = series.map((d) => dayLabel(d.since)), title = (i) => RANGES[range][1] > 1 ? `${dayLabel(series[i].since)} · ${dayLabel(series[i].until - 1)}` : dayLabel(series[i].since);
  const env = stagingOf(st.whole);
  const minutes = (s) => s == null ? null : s / 60;
  const fmtMin = (v) => v < 1 && v > 0 ? `${Math.round(v * 60)} s` : `${fmtNum(v)} ${T.min}`;
  const delays = [
    { name: T.st.toMain, color: "var(--s1)", values: series.map((d) => minutes(d.s.opened_to_landed?.median_s)) },
    ...(env ? [{ name: T.st.toEnv(env), color: "var(--s4)", values: series.map((d) => minutes(d.s.envs?.[env]?.opened_to_served?.median_s)) }] : []),
  ];
  // Agents keep their colour across charts; past the first four they are Other.
  const agents = byAgent(st.whole), names = [...new Set([...agents.map(([n]) => n)])];
  const top = names.filter((n) => agentColor(n) !== "var(--s0)");
  const layers = [...top.map((n) => ({ name: n, color: agentColor(n), values: series.map((d) => byAgent(d.s).filter(([m]) => m === n).reduce((s, [, v]) => s + v, 0)) })),
    { name: T.st.other, color: "var(--s0)", values: series.map((d) => byAgent(d.s).filter(([m]) => !top.includes(m)).reduce((s, [, v]) => s + v, 0)) }].filter((L) => L.values.some((v) => v));
  const machine = [{ name: T.st.proofs, color: "var(--s1)", values: series.map((d) => d.s.machine_minutes?.proofs || 0) }, { name: T.st.fulls, color: "var(--s3)", values: series.map((d) => d.s.machine_minutes?.full_suites || 0) }];
  const w = st.whole, pct = (a, b) => b ? `${Math.round((a / b) * 100)} %` : "";
  // A fact with nothing to say (no proof, no full suite yet) closes the row up.
  const facts = [
    [T.st.proofsN, fmtInt(w.proofs || 0), w.proofs ? T.st.red(pct(w.proofs_red || 0, w.proofs)) : ""],
    [T.st.proofTime, w.proof_duration?.median_s != null ? dur(w.proof_duration.median_s * 1000) : null, w.proof_duration?.p90_s != null ? T.st.p90(dur(w.proof_duration.p90_s * 1000)) : ""],
    [T.st.toFull, w.landed_to_full?.median_s != null ? dur(w.landed_to_full.median_s * 1000) : null, ""],
    [T.st.replays, fmtInt(w.replays || 0), w.replays ? T.st.clean(pct((w.replays || 0) - (w.conflicts || 0), w.replays)) : ""],
    [T.st.fullsN, fmtInt(w.full_suites || 0), [w.full_red && T.st.redN(w.full_red), w.flaky && T.st.flakyN(w.flaky)].filter(Boolean).join(" · ")],
    [T.st.reverts, fmtInt(w.reverts || 0), ""],
  ].filter(([, v]) => v != null);
  const html = `<div class="tiles" id="rtiles"></div>`
    + `<div class="card facts" style="--n:${facts.length}">${facts.map(([l, v, sub]) => `<div><span>${esc(l)}</span><b class="num">${esc(v)}</b><small>${esc(sub)}</small></div>`).join("")}</div>`
    + `<div class="charts">`
    + `<section class="card chart wide"><h3>${esc(T.st.delays)}<small>${esc(T.st.median)}</small>${keys(delays.map((d) => [d.color, d.name]))}</h3>${lines(wide, 220, labels, delays, fmtMin, title)}</section>`
    + `<section class="card chart"><h3>${esc(T.st.perDay)}${keys(layers.map((L) => [L.color, L.name]))}</h3>${columns(half, 200, labels, layers, (v) => fmtNum(v), title)}</section>`
    + `<section class="card chart"><h3>${esc(T.st.perAgent)}<small>${esc(`${fmtInt(w.landings || 0)} ${T.st.landings.toLowerCase()}`)}</small></h3>${agents.length ? bars(half, agents.filter(([, v]) => v > 0).map(([n, v]) => ({ name: n, value: v, color: agentColor(n), sub: pct(v, w.landings) })), (v) => fmtInt(v)) : `<div class="empty">${esc(T.noAgents)}</div>`}</section>`
    + `<section class="card chart wide"><h3>${esc(T.st.machine)}<small>${esc(`${fmtNum(w.machine_minutes?.total || 0)} ${T.min}`)}</small>${keys(machine.map((L) => [L.color, L.name]))}</h3>${columns(wide, 180, labels, machine, (v) => fmtNum(v), title)}</section>`
    + `</div>`;
  // Drawn again only when the numbers change, so the marks draw when there is something new.
  const sig = JSON.stringify([range, w0, series.map((d) => d.s), w]);
  if (box.dataset.sig !== sig) { box.innerHTML = html; box.dataset.sig = sig; box.dataset.h = ""; }
  tiles($("rtiles"), w, null, st.prev, T.st.prevRange(range));
}

// ---- Rail and views ----
function renderRail() {
  for (const id of ["pulse", "pulse2"]) $(id).classList.toggle("off", !S.ok);
  const n = awaiting().length;
  $("b-review").textContent = n ? String(n) : "";
  const att = attention();
  const flag = (id, c) => { const f = $(id); if (c) f.style.setProperty("--c", c); else f.removeAttribute("style"); };
  flag("f-overview", att.some((x) => x.level === 0) ? "var(--red)" : att.some((x) => x.level === 2) ? "var(--amber)" : null);
  flag("f-envs", S.envs.some((e) => [...S.envEvents].reverse().find((x) => x.data.env === e.name && x.kind !== "env.promoted")?.kind === "env.failed") ? "var(--red)" : S.envs.some((e) => e.wanted && e.wanted.position !== e.position) ? "var(--amber)" : null);
  flag("f-setup", [...S.mirror.values()].some((e) => e.kind === "mirror.blocked") ? "var(--red)" : S.work.draining ? "var(--amber)" : null);
  const head = S.line[0]?.position;
  $("headpos").textContent = head != null ? String(head) : "";
  $("version").textContent = S.client?.version ? T.setup.server(S.client.version) : "";
  const signed = S.me?.accounts && S.me.via === "token";
  $("me").hidden = !signed;
  if (signed) $("mename").textContent = S.me.person;
}
function render() {
  renderRail();
  switch (S.view) {
    case "overview": renderAttention(); renderStatTiles(); renderTrack(); renderTasks(); renderFeed(); break;
    case "line": renderFlaky(); renderPositions(); break;
    case "review": renderReview(); break;
    case "stats": renderStats(); break;
    case "envs": renderEnvs(); break;
    case "setup": renderSetup(); break;
  }
  renderSheet();
}
function route() {
  const [v, p] = location.hash.replace(/^#\/?/, "").split("/");
  const view = VIEWS.includes(v) ? v : "overview";
  if (view !== S.view) {
    S.view = view;
    document.querySelectorAll(".view").forEach((s) => s.classList.toggle("on", s.id === "v-" + view));
    document.querySelectorAll("#rail nav a").forEach((a) => { if (a.dataset.view === view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
    document.title = `${T.v[view]} · ${S.repo || "AVP"} · AVP Live`;
    if (!$("sheet").contains(document.activeElement)) scrollTo(0, 0);
    if (S.repo) { if (view === "setup" || view === "envs") loadSetup().then(render); if (view === "stats" || view === "overview") loadStats().then(render); }
  }
  const pos = p != null && p !== "" && /^\d+$/.test(p) ? Number(p) : null;
  // A position in the hash opens once the repo is known (the first route runs before).
  if (pos !== shown && S.repo) {
    if (pos == null) { const was = shown; shown = null; renderSheet(); renderTrack(); if (S.view === "line") renderPositions(); if (was != null) untip(); }
    else openPosition(pos);
  }
  if (S.repo) render();
}
addEventListener("hashchange", route);

// ---- Loop ----
async function tick(first) {
  try {
    const repo = S.repo;
    const [tasks, envs, work] = await Promise.all([api(`/repos/${repo}/tasks?state=open`), api(`/repos/${repo}/envs`), api("/work").catch(() => S.work)]);
    S.tasks = tasks.filter((t) => t.state === "open" || t.state === "Open"); S.envs = envs; S.work = { waiting: 0, running: 0, ...work };
    let moved = first;
    for (let i = 0; i < 10; i++) {
      const evs = await api(`/repos/${repo}/events?since=${S.lastEvent}&limit=500`);
      if (absorb(evs) && evs.some((e) => /landed|line\.|env\./.test(e.kind))) moved = true;
      if (evs.length < 500) break;
    }
    if (moved) await refreshLine();
    // A task's status is read again when one of its events came, and at least every half minute.
    const now = Date.now();
    const stale = S.tasks.filter((t) => !S.statuses.has(t.id) || S.dirty.has(t.id) || now - (S.fetchedAt.get(t.id) || 0) > 30000);
    await Promise.all(stale.map(async (t) => { const st = await api(`/repos/${repo}/tasks/${t.id}`).catch(() => null); if (st) { S.statuses.set(t.id, st); S.fetchedAt.set(t.id, now); S.dirty.delete(t.id); } }));
    for (const id of S.statuses.keys()) if (!S.tasks.some((t) => t.id === id)) { S.statuses.delete(id); S.fetchedAt.delete(id); }
    if ((S.view === "setup" || S.view === "envs") && now - S.setupAt > 30000) await loadSetup();
    if ((S.view === "stats" || S.view === "overview") && now - S.statsAt > 60000) await loadStats();
    S.ok = true;
  } catch { S.ok = false; }
  render();
}

// ---- Sign-in ----
// Shown once a request answers 401 (or GitHub sent the person back with a reason): a token of the
// person's becomes a session cookie of the page's, GitHub's sign-in another when the server has it.
function signIn(why) {
  const box = $("signin");
  if (!box.hidden) return;
  box.hidden = false;
  $("signhint").innerHTML = T.signin.hint;
  $("signtoken").placeholder = T.signin.token;
  $("signbad").textContent = why || "";
  fetch("/auth", { headers: LIVE }).then((r) => r.json()).then((a) => { $("signgh").hidden = !a.github; }).catch(() => {});
  setTimeout(() => $("signtoken").focus(), 60);
}
$("signform").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const token = $("signtoken").value.trim();
  if (!token) return $("signtoken").focus();
  $("signgo").disabled = true;
  const r = await fetch("/session", { method: "POST", headers: { "content-type": "application/json", ...LIVE }, body: JSON.stringify({ token }) }).catch(() => null);
  if (r && r.ok) { location.replace(location.pathname + location.search.replace(/[?&]signin=[^&]*/, "").replace(/^&/, "?") + location.hash); return; }
  $("signgo").disabled = false;
  $("signbad").textContent = T.signin.bad;
  $("signtoken").select();
});
$("signout").addEventListener("click", async () => {
  await fetch("/session", { method: "DELETE", headers: LIVE }).catch(() => null);
  location.reload();
});

(async () => {
  route();
  const why = new URLSearchParams(location.search).get("signin");
  if (why) return signIn(why);
  S.me = await api("/me").catch(() => null);
  if (!$("signin").hidden) return;
  S.repo = await pickRepo();
  for (const id of ["repo", "repo2"]) $(id).textContent = S.repo || "avp";
  document.title = `${T.v[S.view]} · ${S.repo} · AVP Live`;
  S.report = await fetch("/watch/report.json", { cache: "no-store" }).then((r) => (r.ok ? r.json() : null)).catch(() => null);
  await Promise.all([history(), loadSetup(), loadStats(), refreshLine().catch(() => {})]);
  await tick(true);
  route();
  setInterval(() => tick(false), 4000);
  let w = innerWidth;
  addEventListener("resize", () => { renderTrack(); if (Math.abs(innerWidth - w) > 40) { w = innerWidth; if (S.view === "stats" || S.view === "overview") { $("stats").dataset.h = ""; render(); } } });
})();
</script>
