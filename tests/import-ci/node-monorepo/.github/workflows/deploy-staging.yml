name: Deploy staging
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      sha:
        description: Commit to deploy
        required: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
      - run: ./scripts/deploy.sh staging
